services:
  # ---------------------------------------------------------------------
  # 1) Main OM Suite app — unified login + admin approval + Branch,
  #    Customer, OM Automation (CN/GST/Party) and TBB/Bill Mail tools.
  # ---------------------------------------------------------------------
  - type: web
    name: om-suite-main
    runtime: python
    plan: free
    rootDir: main_app
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: FLASK_SECRET
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      # Encrypts each user's own SMTP/IMAP password + AI API key at rest —
      # every user now enters their own Mail + AI details from the app's
      # "My Settings" (/settings) page, not from server env vars. Do NOT
      # change this after first deploy — changing it makes previously saved
      # per-user credentials unreadable (users would need to re-enter them).
      - key: CREDENTIALS_KEY
        generateValue: true
      # Which AI model name to call — not a secret, just a choice. Actual
      # API keys are per-user now (see CREDENTIALS_KEY note above).
      - key: GEMINI_MODEL
        value: "gemini-3.1-flash-lite"
      - key: ANTHROPIC_MODEL
        value: "claude-sonnet-4-5"
      # Without this, main_app falls back to a local SQLite file — which
      # Render's free-plan disk wipes on every redeploy (all users, mail
      # history, and settings would reset). Paste a Postgres connection
      # string (e.g. a free Neon database — same as gr_auto below) during
      # deploy to make it persistent.
      - key: DATABASE_URL
        sync: false
      # GR Auto Modification System (service #2 below) apna alag URL/login
      # rakhta hai — pehli baar dono services deploy karne ke baad, us
      # service ka Render URL yahan paste karke redeploy karo, tab dashboard
      # par uska tile active ho jayega. Khaali chhodne par tile "Link
      # Pending" dikhayega — app crash nahi hoti.
      - key: GR_AUTO_URL
        sync: false

  # ---------------------------------------------------------------------
  # 2) GR Auto Modification System — separate app, own login/DB, left
  #    completely untouched. Deployed as its own Render service.
  # ---------------------------------------------------------------------
  - type: web
    name: gr-auto-modification-system
    runtime: python
    plan: free
    rootDir: gr_auto_modification_system
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -w 2 -b 0.0.0.0:$PORT \"app:create_app()\""
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: WTF_CSRF_ENABLED
        value: "1"
      - key: SESSION_LIFETIME_MINUTES
        value: "480"
      - key: SAVE_API_ENABLED
        value: "false"
      - key: SAVE_API_URL
        value: "/manual-cn/modification/{cn_no}"
      - key: SAVE_API_METHOD
        value: "PUT"
      - key: API_BASE_URL
        value: "https://load.omone.in/utility-service/api"
      - key: API_AUTH_MODE
        value: "none"
      # Paste your Postgres (e.g. Neon) connection string during deploy.
      - key: DATABASE_URL
        sync: false
