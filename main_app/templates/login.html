<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Enterprise Logistics Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================================================
           ENTERPRISE LOGISTICS LOGIN PAGE - CSS
           ================================================== */
        :root {
            --primary-blue: #0877EE;
            --dark-blue: #005BD4;
            --text-primary: #07101D;
            --text-secondary: #718096;
            --text-sub: #7A8494;
            --border-color: #E1E6ED;
            --visual-bg: #EEF5FB;
            --white: #FFFFFF;
            --font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: var(--font-family);
            background-color: var(--primary-blue);
            -webkit-font-smoothing: antialiased;
        }

        /* Outer Container */
        .page-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: var(--primary-blue);
        }

        /* Main Auth Card (90–92% width, 75–82% height) */
        .auth-card {
            width: 91vw;
            max-width: 1280px;
            height: 80vh;
            max-height: 720px;
            min-height: 560px;
            background: var(--white);
            border-radius: 8px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
        }

        /* LEFT FORM PANEL (40–42% Width) */
        .auth-form-section {
            flex: 0 0 41%;
            width: 41%;
            height: 100%;
            background: var(--white);
            padding: 40px 48px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow-y: auto;
        }

        .form-wrapper {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        /* Branding Header */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: var(--primary-blue);
            border-radius: 6px;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-name {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        /* Typography */
        .page-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .page-subtitle {
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        /* Error Banner */
        .auth-error {
            background: #FFF1F3;
            border: 1px solid #FFD1D9;
            color: #B4233D;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Inputs */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon.left {
            position: absolute;
            left: 14px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 44px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--white);
            padding: 0 40px 0 42px;
            font-size: 12px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(8, 119, 238, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
        }

        .password-toggle:hover {
            color: var(--primary-blue);
        }

        /* Options Row */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--primary-blue);
            border-radius: 3px;
            cursor: pointer;
        }

        .remember-me span {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .forgot-link {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-blue);
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Primary Submit Button */
        .btn-primary {
            width: 100%;
            height: 44px;
            border-radius: 6px;
            background: var(--primary-blue);
            color: var(--white);
            font-size: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary:hover {
            background: var(--dark-blue);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(8, 119, 238, 0.25);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-loading {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .spinner {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Footer Link */
        .auth-footer {
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-secondary);
            text-align: left;
        }

        .auth-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        /* RIGHT VISUAL SECTION (58–60% Width) */
        .auth-visual-section {
            flex: 1;
            background: var(--visual-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .visual-illustration {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logistics-3d-svg {
            width: 100%;
            height: 100%;
            max-width: 750px;
        }

        /* RESPONSIVE DESIGN */
        @media (max-width: 992px) {
            .auth-card {
                width: 95vw;
                height: auto;
                min-height: auto;
            }
            .auth-form-section {
                flex: 0 0 50%;
                width: 50%;
                padding: 32px;
            }
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 0;
            }
            .auth-card {
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .auth-visual-section {
                display: none;
            }
            .auth-form-section {
                flex: 0 0 100%;
                width: 100%;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <main class="auth-card">
            <!-- LEFT FORM PANEL -->
            <section class="auth-form-section">
                <div class="form-wrapper">
                    <!-- Brand Section -->
                    <div class="brand">
                        <div class="brand-logo">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                <line x1="12" y1="22.08" x2="12" y2="12"></line>
                            </svg>
                        </div>
                        <div>
                            <div class="brand-name">LOGISTICS PRO</div>
                            <div class="brand-subtitle">ENTERPRISE SUITE</div>
                        </div>
                    </div>

                    <h1 class="page-title">SIGN IN</h1>
                    <p class="page-subtitle">Welcome back! Please sign in to access your logistics operations dashboard.</p>

                    {% if error %}
                    <div class="auth-error" role="alert">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}

                    <form method="post" action="/login" id="loginForm">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="form-group">
                            <label for="username">Username</label>
                            <div class="input-wrapper">
                                <svg class="input-icon left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus autocomplete="username">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                                <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                                    <svg class="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="remember-me">
                                <input type="checkbox" name="remember" value="1" checked>
                                <span>Remember me on this device</span>
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-primary" id="loginBtn">
                            <span class="btn-text">Sign In</span>
                            <span class="btn-loading" style="display:none;">
                                <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity="0.25"></circle><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"></path></svg>
                                Signing in…
                            </span>
                        </button>
                    </form>

                    <div class="auth-footer">
                        New to the system? <a href="/signup">Create an account</a>
                    </div>
                </div>
            </section>

            <!-- RIGHT VISUAL PANEL -->
            <section class="auth-visual-section">
                <div class="visual-illustration">
                    <svg viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" class="logistics-3d-svg">
                        <defs>
                            <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#F7FAFC"/>
                                <stop offset="100%" stop-color="#EEF5FB"/>
                            </linearGradient>
                            <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#0877EE"/>
                                <stop offset="100%" stop-color="#005BD4"/>
                            </linearGradient>
                        </defs>

                        <rect width="800" height="600" fill="url(#bgGrad)"/>
                        <path d="M120 380 L400 220 L680 380 L400 540 Z" fill="#E1EBF5" stroke="#CBDCF0" stroke-width="1.5"/>
                        <path d="M220 330 L380 240 L540 330 L380 420 Z" fill="#FFFFFF" stroke="#D3E1F5" stroke-width="2"/>
                        <path d="M220 330 L220 410 L380 500 L380 420 Z" fill="#F4F8FE" stroke="#CBDCF5" stroke-width="2"/>
                        <path d="M540 330 L540 410 L380 500 L380 420 Z" fill="#E8F1FC" stroke="#CBDCF5" stroke-width="2"/>
                        <path d="M260 290 L380 220 L500 290" stroke="#0877EE" stroke-width="4" stroke-dasharray="6 4" fill="none"/>
                        <path d="M260 290 L260 370 L380 440" stroke="#0877EE" stroke-width="3" fill="none"/>
                        <path d="M500 290 L500 370 L380 440" stroke="#0877EE" stroke-width="3" fill="none"/>
                        <rect x="330" y="270" width="100" height="60" rx="6" fill="url(#blueGlow)"/>
                        <rect x="340" y="280" width="80" height="8" rx="2" fill="#FFFFFF"/>
                        <rect x="340" y="295" width="50" height="5" rx="2" fill="#93C5FD"/>
                        <rect x="340" y="305" width="65" height="5" rx="2" fill="#93C5FD"/>
                        <circle cx="260" cy="370" r="8" fill="#0877EE"/>
                        <circle cx="500" cy="370" r="8" fill="#0877EE"/>
                        <circle cx="380" cy="440" r="10" fill="#005BD4"/>
                        <circle cx="380" cy="220" r="8" fill="#0877EE"/>
                        
                        <g transform="translate(180, 200)">
                            <rect width="60" height="50" rx="6" fill="#FFFFFF" stroke="#0877EE" stroke-width="2"/>
                            <path d="M15 20 L45 20 M15 30 L35 30" stroke="#0877EE" stroke-width="3" stroke-linecap="round"/>
                        </g>
                        <g transform="translate(540, 180)">
                            <rect width="70" height="55" rx="6" fill="#FFFFFF" stroke="#0877EE" stroke-width="2"/>
                            <circle cx="35" cy="28" r="12" fill="#E0F2FE"/>
                            <path d="M35 20 L35 36 M27 28 L43 28" stroke="#0877EE" stroke-width="2.5"/>
                        </g>
                        
                        <path d="M240 225 L330 280" stroke="#0877EE" stroke-width="2" stroke-dasharray="4 4"/>
                        <path d="M540 207 L430 280" stroke="#0877EE" stroke-width="2" stroke-dasharray="4 4"/>
                    </svg>
                </div>
            </section>
        </main>
    </div>

    <script>
        /* ==================================================
           ENTERPRISE LOGISTICS LOGIN PAGE - JAVASCRIPT
           ================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            // Password Show/Hide Toggle
            const togglePasswordBtn = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    
                    const eyeIcon = togglePasswordBtn.querySelector('.eye-icon');
                    if (eyeIcon) {
                        eyeIcon.style.opacity = isPassword ? '0.5' : '1';
                    }
                });
            }

            // Form Submit Loading State
            const loginForm = document.getElementById('loginForm');
            const loginBtn = document.getElementById('loginBtn');

            if (loginForm && loginBtn) {
                loginForm.addEventListener('submit', () => {
                    const btnText = loginBtn.querySelector('.btn-text');
                    const btnLoading = loginBtn.querySelector('.btn-loading');

                    if (btnText && btnLoading) {
                        btnText.style.display = 'none';
                        btnLoading.style.display = 'inline-flex';
                    }

                    loginBtn.disabled = true;
                });
            }
        });
    </script>
</body>
</html>
