<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup — Enterprise Logistics Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==================================================
           PREMIUM LIVE BACKGROUND & CENTERED LAYOUT
           ================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0877EE, #005BD4, #0a2540, #0877EE);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            padding: 20px;
        }

        /* Live Moving Background Animation */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Particles for 'Live' Feel */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            animation: floatUp 25s linear infinite;
            bottom: -150px;
            border-radius: 4px;
        }

        .particles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .particles li:nth-child(2) { left: 10%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 12s; border-radius: 50%; }
        .particles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .particles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; border-radius: 50%; }
        .particles li:nth-child(5) { left: 65%; width: 40px; height: 40px; animation-delay: 0s; }
        .particles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* ==================================================
           CENTERED GLASSMORPHISM CARD
           ================================================== */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Branding Header */
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            background: #0877EE;
            border-radius: 8px;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(8, 119, 238, 0.3);
        }

        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #07101D;
        }

        /* Notices & Alerts */
        .info-alert {
            background: #F0F7FF;
            border: 1px solid #BAE3FF;
            border-left: 4px solid #0877EE;
            color: #005BD4;
            padding: 12px 16px;
            font-size: 12px;
            border-radius: 6px;
            margin-bottom: 24px;
            line-height: 1.5;
            font-weight: 500;
        }

        .auth-error {
            background: #FFF1F3;
            border: 1px solid #FFD1D9;
            color: #B4233D;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group span.hint {
            color: #94A3B8;
            font-weight: 400;
        }

        .form-group input {
            width: 100%;
            height: 46px;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
            padding: 0 16px;
            font-size: 14px;
            color: #0F172A;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: #0877EE;
            box-shadow: 0 0 0 4px rgba(8, 119, 238, 0.1);
        }

        .form-group input::placeholder {
            color: #CBD5E1;
        }

        /* Submit Button */
        .btn-primary {
            width: 100%;
            height: 48px;
            border-radius: 8px;
            background: #0877EE;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(8, 119, 238, 0.2);
        }

        .btn-primary:hover {
            background: #005BD4;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(8, 119, 238, 0.3);
        }

        /* Footer */
        .auth-footer {
            margin-top: 24px;
            font-size: 13px;
            color: #64748B;
            text-align: center;
            font-weight: 500;
        }

        .auth-footer a {
            color: #0877EE;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .auth-footer a:hover {
            color: #005BD4;
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Live Animated Floating Background -->
    <ul class="particles">
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
        <li></li>
    </ul>

    <!-- Centered Form Card -->
    <main class="auth-card">
        
        <div class="brand">
            <div class="brand-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
            </div>
            <div class="brand-name">LOGISTICS PRO</div>
        </div>

        <div class="info-alert">
            <strong>Note:</strong> Pehla signup automatically admin ban jata hai, baaki sab approval ka wait karte hain.
        </div>

        {% if error %}
        <div class="auth-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label>Username <span class="hint">(lowercase, jaise: ankit.singh)</span></label>
                <input type="text" name="username" placeholder="e.g. ankit.singh" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Minimum 8 characters" required minlength="8">
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Re-enter password" required minlength="8">
            </div>

            <button type="submit" class="btn-primary">Create an Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login">Sign In</a>
        </div>
    </main>

</body>
</html>
