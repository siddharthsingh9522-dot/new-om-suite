<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup — TBB Mail</title>
<link rel="stylesheet" href="/static/auth.css">
</head>
<body>
<div class="auth-wrap">
  <h1>Naya Account</h1>
  <p class="sub">Pehla signup automatically admin ban jata hai, baaki sab approval ka wait karte hain.</p>
  {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Poora Naam</label>
    <input type="text" name="name" required>
    <label>Username</label>
    <input type="text" name="username" required placeholder="lowercase, jaise: ankit.singh">
    <label>Email</label>
    <input type="email" name="email" required>
    <label>Password</label>
    <input type="password" name="password" required minlength="8">
    <label>Password (dubara)</label>
    <input type="password" name="confirm_password" required minlength="8">
    <button type="submit">Account Banayein</button>
  </form>
  <div class="auth-links">Pehle se account hai? <a href="/login">Login karein</a></div>
</div>
</body>
</html>
