<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - GR Auto Modification System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
<style>
  body { background: var(--brand-navy); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 380px; background: #fff; border-radius: .9rem; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .login-brand { display:flex; align-items:center; gap:.5rem; font-weight:700; color: var(--brand-navy); margin-bottom: 1.25rem; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-brand"><i class="bi bi-truck fs-4"></i> <span>GR Auto Mod</span></div>
  <p class="text-muted small mb-3">Sign in with your operator credentials to access modification actions. You can still browse in preview-only mode without logging in.</p>

  <div id="loginAlert" class="alert alert-danger py-2 small" style="display:none;"></div>

  <div class="mb-3">
    <label class="form-label">User ID</label>
    <input type="text" class="form-control" id="userId" autocomplete="username">
  </div>
  <div class="mb-3">
    <label class="form-label">Password</label>
    <input type="password" class="form-control" id="password" autocomplete="current-password">
  </div>
  <div class="mb-3">
    <label class="form-label">Branch Code</label>
    <input type="text" class="form-control" id="branchCode" placeholder="e.g. 1603">
  </div>
  <button class="btn btn-primary w-100" id="loginBtn"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
  <div class="text-center mt-3">
    <a href="{{ url_for('dashboard.index') }}" class="small text-muted">Continue without logging in &rarr;</a>
  </div>
</div>

<script>
document.getElementById("loginBtn").addEventListener("click", async () => {
  const user_id = document.getElementById("userId").value.trim();
  const password = document.getElementById("password").value;
  const branch_code = document.getElementById("branchCode").value.trim();
  const alertBox = document.getElementById("loginAlert");
  alertBox.style.display = "none";

  if (!user_id || !password || !branch_code) {
    alertBox.textContent = "Please fill in all fields.";
    alertBox.style.display = "block";
    return;
  }

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id, password, branch_code }),
    });
    const data = await res.json();
    if (!data.ok) {
      alertBox.textContent = data.error || "Login failed.";
      alertBox.style.display = "block";
      return;
    }
    window.location.href = "/";
  } catch (e) {
    alertBox.textContent = "Could not reach the server. Please try again.";
    alertBox.style.display = "block";
  }
});
</script>
</body>
</html>
